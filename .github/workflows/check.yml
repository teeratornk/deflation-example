name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.9.30'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra plot --python '${{ matrix.python }}'
      - run: uv run --locked --extra plot pytest -m 'not gpu'
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv build
      - run: uv run --locked python tools/check_release.py --source . --history dist/*.whl dist/*.tar.gz
      - name: Install and reproduce the wheel outside the checkout
        shell: bash
        run: |
          example_env=$(mktemp -d)
          uv venv "$example_env/venv" --python '${{ matrix.python }}'
          uv export --locked --no-dev --extra plot --no-emit-project --format requirements-txt --output-file "$example_env/requirements.txt"
          uv pip install --python "$example_env/venv/bin/python" --require-hashes -r "$example_env/requirements.txt"
          uv pip install --python "$example_env/venv/bin/python" --no-deps dist/*.whl
          cd "$example_env"
          for problem in diffusion thermal cht; do
            "$example_env/venv/bin/deflation-example" "problem=$problem" plot=true "output=$problem"
          done
          for tutorial in spectral verification costs; do
            "$example_env/venv/bin/python" -m deflation_example.tutorials "$tutorial" --records "$GITHUB_WORKSPACE/examples/benchmarks" --output "tutorial-$tutorial"
          done
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: cpu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.9.30'
      - name: Check tag against package version
        run: python3 -c 'import os, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v'
      - run: uv build
      - name: Publish tagged distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file CHANGELOG.md
