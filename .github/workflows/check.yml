name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.9.30'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra plot --extra study --python '${{ matrix.python }}'
      - run: uv run --locked --extra plot --extra study pytest -m 'not gpu'
      - name: Regenerate relocated evidence from the clean checkout
        run: uv run --locked --extra plot --extra study python tools/reproduce_repository_examples.py --output runs/relocated-evidence
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv build
      - run: uv run --locked python tools/check_release.py --source . --history dist/*.whl dist/*.tar.gz
      - name: Install and reproduce the wheel outside the checkout
        shell: bash
        run: |
          example_env=$(mktemp -d)
          uv venv "$example_env/venv" --python '${{ matrix.python }}'
          uv export --locked --no-dev --extra plot --extra study --no-emit-project --format requirements-txt --output-file "$example_env/requirements.txt"
          uv pip install --python "$example_env/venv/bin/python" --require-hashes -r "$example_env/requirements.txt"
          uv pip install --python "$example_env/venv/bin/python" --no-deps dist/*.whl
          cd "$example_env"
          for problem in diffusion thermal cht; do
            "$example_env/venv/bin/deflation-example" "problem=$problem" plot=true "output=$problem"
          done
          for tutorial in spectral verification costs; do
            "$example_env/venv/bin/python" -m deflation_example.tutorials "$tutorial" --records "$GITHUB_WORKSPACE/examples/benchmarks" --output "tutorial-$tutorial"
          done
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht phase=final device=cpu 'methods=[jacobi,reference,recycling]' problem=transient n=3 slabs=3 targets=3 rank=5 window=8 bound=0.0001 repeats=1 output=trajectory
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht_report --records-roots trajectory --output trajectory-summary
          "$example_env/venv/bin/python" -m deflation_example.benchmark_transfer --records-root trajectory --output transfer --repeats 1
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht_presentation --records-roots trajectory --main-studies trajectory --physical-studies trajectory --output trajectory-figures
          "$example_env/venv/bin/python" -m deflation_example.benchmark_transfer_report --records-roots transfer --figure-studies transfer --output transfer-summary
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht_conditioning --output conditioning
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht_validation --output independent-validation
          "$example_env/venv/bin/python" -m deflation_example.benchmark_cht_support --validation-root independent-validation --conditioning-root conditioning --pilot-roots trajectory --output supporting-tables
          "$example_env/venv/bin/python" -m deflation_example.benchmark_mesh targets=2 transient=true rank=20 spatial_reference=scaled_schur temporal_metric=jacobi output=mesh-trajectory
          "$example_env/venv/bin/python" -m deflation_example.mesh_transfer --record mesh-trajectory/reference-0/record.json --output mesh-transfer --samples 2 --repeats 1
          "$example_env/venv/bin/python" -m deflation_example.mesh_presentation --records mesh-trajectory --output mesh-figures --fields
          "$example_env/venv/bin/python" -m deflation_example.validate_mesh --output mesh-independent-validation
          "$example_env/venv/bin/python" -m deflation_example.benchmark_mesh targets=2 transient=true rank=20 spatial_reference=scaled_schur temporal_metric=jacobi +residual_policy=refine output=mesh-residual-correction
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: cpu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.9.30'
      - name: Check tag against package version
        run: python3 -c 'import os, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v'
      - run: uv build
      - name: Publish tagged distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file CHANGELOG.md
