backtracking: halving
secant_memory: 0
evaluation_progress: false
linear_progress: false
qp_tolerance: 1.0e-10
qp_cap: 100
inner_tolerance: 1.0e-10
inner_cap: 50000
threads: 4
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
