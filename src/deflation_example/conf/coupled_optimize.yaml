defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

baseline_directory: null
reference_baseline_directory: null
reference_construction: mode_dependent
reference_spatial_policy: scaled_schur
reference_temporal_metric: jacobi
reference_temporal_solver: dense
reference_transfer: full
output: runs/coupled-optimization
mode: derivatives
transient: false
slabs: 16
horizon_s: 600.0
target_startup_s: 0.0
alpha: 1.0e-14
query: 7
target_count: 16
lower_K: 337.3
upper_K: 357.3
methods: [jacobi, reference, recycling]
device: cpu
rank: 20
recycle_window: 20
flow_tolerance: 1.0e-9
flow_cap: 100
flow_continuation: false
momentum_factor_policy: retained
transport_form: advective
consistent_stabilization: false
nonlinear_tolerance: 1.0e-8
nonlinear_cap: 100
backtracking: halving
secant_memory: 0
evaluation_progress: false
linear_progress: false
qp_tolerance: 1.0e-10
qp_cap: 100
inner_tolerance: 1.0e-10
inner_cap: 50000
inner_refresh: 1000
hybrid_block_min_columns: 20
hybrid_block_max_columns: 100
hybrid_coarse_device: cpu
initial_control_directory: null
initial_control_method: reference
initial_control_position: null
initial_control_repeat: 1
threads: 4
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
